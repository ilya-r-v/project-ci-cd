name: Healthcheck

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check prod health
        id: check
        run: |
          if curl -sf http://${{ secrets.VPS_HOST }}:3000/health > /dev/null; then
            echo "status=up" >> "$GITHUB_OUTPUT"
          else
            echo "status=down" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify if down
        if: steps.check.outputs.status == 'down'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="🔴 ALERT: Prod (${{ secrets.VPS_HOST }}:3000) is DOWN! $(date -u)"