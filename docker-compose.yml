services:
  api:
    build:
      context: .
      target: dev
    ports: 
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - PORT=3000

  test: 
    build:
      context: .
      target: dev
    volumes:
    - .:/app
    - /app/node_modules
    command: npm test
    profiles: ["test"]
  
  prometheus:
    image: prom/prometheus:latest
    volumes:
     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
     - "9090:9090"
    depends_on:
      - api
  
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3030:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/dashboard.json:/var/lib/grafana/dashboards/dashboard.json
    depends_on:
      - prometheus

volumes:
  grafana-data: